name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m linux_tui --discover
      - run: python -m linux_tui --catalog
      - if: runner.os == 'Linux'
        run: python tools/smoke_test.py
      - if: runner.os == 'Linux'
        name: Install and verify launcher
        run: |
          python tools/install.py --prefix "$RUNNER_TEMP/linux tui"
          "$RUNNER_TEMP/linux tui/bin/linux-tui" --version
          "$RUNNER_TEMP/linux tui/bin/linux-tui" --discover
